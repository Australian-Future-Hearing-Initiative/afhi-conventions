name: Convention review

on:
  workflow_call:
    inputs:
      label:
        description: The label that requests a review; removed once the review is done.
        type: string
        default: claude-review
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: convention-review-${{ github.repository }}-${{ github.event.pull_request.number }}

env:
  PR: ${{ github.event.pull_request.number }}
  LABEL: ${{ inputs.label }}

jobs:
  check:
    if: >-
      github.event.pull_request.user.type != 'Bot'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      labelled: ${{ steps.label.outputs.labelled }}
    steps:
      # A queued run's event still shows the label after an earlier run removed it.
      - name: Check the label is still there
        id: label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          labels=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')
          if grep --quiet --line-regexp --fixed-strings "$LABEL" <<< "$labels"; then
            echo "labelled=true" >> "$GITHUB_OUTPUT"
          fi

  review:
    needs: check
    if: needs.check.outputs.labelled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # Download only CONVENTIONS.md: a repo follows a language file once the sync adds it to .afhi/.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Australian-Future-Hearing-Initiative/afhi-conventions
          path: .afhi-conventions
          sparse-checkout: CONVENTIONS.md # Download only that file instead of the whole repo
          sparse-checkout-cone-mode: false # Treat as an exact file name rather than a folder

      - name: Save existing comments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .afhi-review
          {
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/comments" --paginate --jq '.[] | {path, line, body}'
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[] | {body}'
          } > .afhi-review/existing-comments.jsonl
      - uses: anthropics/claude-code-action@6c690188da61cf16ee7debb28383ba67f02abb4c # v1.0.242
        # A failed review must never turn the PR's checks red.
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --model ${{ vars.CONVENTION_REVIEW_MODEL || 'claude-sonnet-5-5' }}
            --max-turns 30
            --allowedTools "Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Agent"
          prompt: |
            Review PR #${{ github.event.pull_request.number }} in ${{ github.repository }} against the
            AFHI engineering conventions. Read it with
            `gh pr view ${{ github.event.pull_request.number }}` and
            `gh pr diff ${{ github.event.pull_request.number }}`. Report only clear violations on
            lines the PR adds or changes; code it does not touch is out of scope.
            Change no files.

            Which rules apply:
            - If the repository has an .afhi/ folder, the files in it: the shared
              files it adopted, at the revision in .afhi/REVISION. Otherwise only
              .afhi-conventions/CONVENTIONS.md.
            - The repository's AGENTS.md, if it has one. The more specific file
              wins, and an exception it records is not a finding.

            Also check the PR title and description against the rules for commits
            and pull requests. Skip anything a formatter, linter or type checker
            enforces, and anything already raised in
            .afhi-review/existing-comments.jsonl.

            Output:
            - At most 5 inline comments, one or two sentences each, starting with
              the rule's file and section, e.g. "CONVENTIONS.md, Tests: ...".
            - Then exactly one `gh pr comment` of at most 3 lines: the number of
              findings, any that did not fit inline, and any about the title or
              description. Leave out a line that would say "none". With no new
              findings, write only "Convention review: no new issues found."
            - No praise, no summary of the diff, nothing beyond the rules.
            - Never quote values from data files or anything that could be
              participant data; name the file and line instead.

      - name: Remove the label so the next review needs a new request
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label "$LABEL"
