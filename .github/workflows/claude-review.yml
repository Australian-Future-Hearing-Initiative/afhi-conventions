name: Claude review

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

permissions:
  contents: read

# One group per PR keeps reviews in order; a replaced queued run loses nothing, since every run rereads the labels.
concurrency:
  group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number }}

env:
  PR: ${{ github.event.pull_request.number }}
  GH_REPO: ${{ github.repository }}
  CORRECTNESS_LABEL: claude-correctness
  CONVENTIONS_LABEL: claude-conventions

jobs:
  check:
    if: >-
      github.event.pull_request.user.type != 'Bot'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      correctness: ${{ steps.labels.outputs.correctness }}
      conventions: ${{ steps.labels.outputs.conventions }}
    steps:
      # A queued run's event still shows labels that an earlier run has since removed.
      - name: Check which review labels are still there
        id: labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          labels=$(gh pr view "$PR" --json labels --jq '.labels[].name')
          has_label() { grep --quiet --line-regexp --fixed-strings "$1" <<< "$labels"; }
          if has_label "$CORRECTNESS_LABEL"; then echo "correctness=true" >> "$GITHUB_OUTPUT"; fi
          if has_label "$CONVENTIONS_LABEL"; then echo "conventions=true" >> "$GITHUB_OUTPUT"; fi

  correctness:
    needs: check
    if: needs.check.outputs.correctness == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Save existing comments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .afhi-review
          {
            gh api "repos/$GH_REPO/pulls/$PR/comments" --paginate --jq '.[] | {path, line, body}'
            gh api "repos/$GH_REPO/issues/$PR/comments" --paginate --jq '.[] | {body}'
          } > .afhi-review/existing-comments.jsonl
      - id: claude
        uses: anthropics/claude-code-action@6c690188da61cf16ee7debb28383ba67f02abb4c # v1.0.242
        # A failed review must never turn the PR's checks red.
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --model ${{ vars.CORRECTNESS_REVIEW_MODEL || 'claude-opus-5-5' }}
            --max-turns 60
            --allowedTools "Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Agent"
          prompt: |
            Review PR #${{ env.PR }} in ${{ env.GH_REPO }} for correctness bugs: code
            that crashes, gives a wrong result, loses or corrupts data, or breaks
            the contract its docstring, the PR description or the repository's
            docs state. Read the PR with `gh pr view ${{ env.PR }}` and
            `gh pr diff ${{ env.PR }}`. Change no files.

            First work out what the changed code is meant to do, from:
            - The PR title and description. If the description has a "Review
              focus" section, check that first.
            - The docstrings and comments on the changed code, the repository's
              AGENTS.md if it has one, and any docs/ page they point to.
            - The code the change calls and the code that calls it. Read any file
              you need.

            What to report:
            - Bugs on lines the PR adds or changes, and bugs the change causes in
              code it calls or that calls it. Code the change does not affect is
              out of scope.
            - Only a bug you can state as a concrete failure: the input or state,
              and the crash, wrong result or broken contract it leads to. Leave
              out anything you cannot state that way.
            - When a bug depends on something the code does not settle, such as
              the units a caller passes, name that assumption.
            - Leave out style, naming, comments and documentation wording, which
              the convention review covers, and anything a formatter, linter or
              type checker enforces. Also leave out anything already raised in
              .afhi-review/existing-comments.jsonl.

            Output:
            - One inline comment per bug, on the changed line that causes it, in
              two to four sentences: the failure first ("When `x` is empty, ..."),
              then the cause.
            - Then exactly one `gh pr comment`. Its first line is "Correctness
              review (bugs: crashes, wrong results, broken contracts): N
              findings.", with N the number of findings. Then one line as
              `file:line — problem` for each bug that no changed line could
              carry; leave out that list when it is empty. With no new findings,
              end the first line with "no new issues found." and add nothing.
            - No praise, no summary of the diff, nothing beyond the bugs.
            - Never quote values from data files or anything that could be
              participant data; name the file and line instead.

      - name: Tell the author if the review failed
        if: steps.claude.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR" --body "Correctness review failed; see [the run]($RUN_URL). Add the \`$CORRECTNESS_LABEL\` label again to retry."

      - name: Remove the label so the next review needs a new request
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit "$PR" --remove-label "$CORRECTNESS_LABEL"

  conventions:
    needs: [check, correctness]
    # Runs after the correctness review, even a skipped one, so it can see and skip that review's findings.
    if: >-
      !cancelled()
      && needs.check.outputs.conventions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # Download only CONVENTIONS.md: a repo follows a language file once the sync adds it to .afhi/.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Australian-Future-Hearing-Initiative/afhi-conventions
          path: .afhi-conventions
          sparse-checkout: CONVENTIONS.md # Download only that file instead of the whole repo
          sparse-checkout-cone-mode: false # Treat as an exact file name rather than a folder

      - name: Save existing comments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .afhi-review
          {
            gh api "repos/$GH_REPO/pulls/$PR/comments" --paginate --jq '.[] | {path, line, body}'
            gh api "repos/$GH_REPO/issues/$PR/comments" --paginate --jq '.[] | {body}'
          } > .afhi-review/existing-comments.jsonl
      - id: claude
        uses: anthropics/claude-code-action@6c690188da61cf16ee7debb28383ba67f02abb4c # v1.0.242
        # A failed review must never turn the PR's checks red.
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --model ${{ vars.CONVENTION_REVIEW_MODEL || 'claude-sonnet-5-5' }}
            --max-turns 30
            --allowedTools "Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Agent"
          prompt: |
            Review PR #${{ env.PR }} in ${{ env.GH_REPO }} against the AFHI engineering
            conventions. Read it with `gh pr view ${{ env.PR }}` and
            `gh pr diff ${{ env.PR }}`. Report only clear violations on lines the PR
            adds or changes; code it does not touch is out of scope.
            Change no files.

            Which rules apply:
            - If the repository has an .afhi/ folder, the files in it: the shared
              files it adopted, at the revision in .afhi/REVISION. Otherwise only
              .afhi-conventions/CONVENTIONS.md.
            - The repository's AGENTS.md, if it has one. The more specific file
              wins, and an exception it records is not a finding.

            Also check the PR title and description against the rules for commits
            and pull requests. Skip anything a formatter, linter or type checker
            enforces, and anything already raised in
            .afhi-review/existing-comments.jsonl.

            Output:
            - Group findings that break the same rule into one comment that lists
              every line it applies to.
            - At most 10 inline comments, one or two sentences each, starting with
              the rule's file and section, e.g. "CONVENTIONS.md, Tests: ...".
            - Then exactly one `gh pr comment`. Its first line is "Convention
              review (everything in CONVENTIONS.md: style, docs, tests, design,
              PR format): N findings.", with N the number of findings. Then any
              findings about the title or description, then every finding that
              did not fit inline, one line each as `file:line — rule: problem`.
              Leave out a part that would be empty. With no new findings, end
              the first line with "no new issues found." and add nothing.
            - No praise, no summary of the diff, nothing beyond the rules.
            - Never quote values from data files or anything that could be
              participant data; name the file and line instead.

      - name: Tell the author if the review failed
        if: steps.claude.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR" --body "Convention review failed; see [the run]($RUN_URL). Add the \`$CONVENTIONS_LABEL\` label again to retry."

      - name: Remove the label so the next review needs a new request
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit "$PR" --remove-label "$CONVENTIONS_LABEL"
